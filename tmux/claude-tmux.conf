# claude-tmux：按键、鼠标、钩子。在你的 tmux 配置最后加一行引用它：
#
#     source-file ~/projects/claude-tmux-sessions/tmux/claude-tmux.conf
#
# 底栏要显示什么（各会话状态、开关侧栏的按钮、整机资源）每个人的主题不一样，这里不设，
# 照 README「底栏」一节把那几段 #(...) 拼进你自己的 status-left / status-right。
# 下面引用的脚本都在 ~/.claude/hooks/ 下，是 install.sh 建的软链。

# ---- 键盘 -------------------------------------------------------------------
# prefix + g：选择器（所有会话，按 session 分组，带预览，输编号跳）
bind g run-shell 'tmux display-popup -w 95% -h 85% -E "CALLER_PANE=#{pane_id} ~/.claude/hooks/claude-tmux-picker.sh"'
# prefix + a：不看界面，直接跳到最该处理的那个会话（先 ⏸ 等确认的，再 ✔ 做完没看的）
bind a run-shell '~/.claude/hooks/jump-top.sh'

# ---- 鼠标：底栏 --------------------------------------------------------------
# 点底栏最左边（session 名那段）：浮出选择器，按 session 看
bind -n MouseDown1StatusLeft run-shell 'CLAUDE_TMUX_MODE=session ~/.claude/hooks/float-picker.sh #{pane_id}'
# 点底栏上能点的那几段（status-badge.sh / float-tool.sh 输出的 #[range=user|…]）：
#   窗口名 → 切过去；tool:swap → 回到上一个 session；tool:*（侧栏开关、资源小窗）→ float-tool.sh；
#   其余（各会话状态计数）→ status-click.sh 打开对应的列表
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},window}' { switch-client -t = } { if -F '#{==:#{mouse_status_range},tool:swap}' { switch-client -l } { if -F '#{m:tool:*,#{mouse_status_range}}' { run-shell '~/.claude/hooks/float-tool.sh "#{pane_id}" "#{mouse_status_range}"' } { run-shell '~/.claude/hooks/status-click.sh "#{mouse_status_range}" "#{pane_id}" "#{client_name}"' } } }

# ---- 鼠标：窗格 --------------------------------------------------------------
# 1. 点在浮窗外面、而这个窗口开着 git / 文件 / 资源弹窗：先关掉弹窗。不靠弹窗的 pane-focus-out 钩子，
#    select-pane 切焦点时它不一定触发。
# 2. 点侧栏（打了 @nofocus）：只把点击转过去，不把焦点给它——侧栏不能打字，焦点留在 Claude 的输入框。
bind -n MouseDown1Pane {
  if -F '#{&&:#{!:#{pane_floating_flag}},#{P:#{?#{m:tool:*,#{@picker_float}},1,}}}' { run-shell -b '~/.claude/hooks/float-tool.sh --close-tools #{window_id}' }
  if -F '#{@nofocus}' { send-keys -M } { select-pane -t = ; send-keys -M }
}

# ---- 钩子 -------------------------------------------------------------------
# 切到一个窗格就算看过了：✔ 变 ✓。不动 ⏸（顺手划过不该把等确认的告警消掉）。
set-hook -g pane-focus-in 'run-shell -b "python3 ~/.claude/hooks/tmux_status_update.py mark-seen #{pane_id}"'
